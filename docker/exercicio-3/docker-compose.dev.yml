services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app 
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=exercicio2
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=exercicio2
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: